# dnsmasq configuration for service discovery
# Disable DNS forwarding - we only need local service discovery
port=0

# Enable SRV record support
# SRV record format: srv-host=_service._proto.domain,target,port,priority,weight

# Backend service SRV records for _http._tcp.services.local
srv-host=_http._tcp.services.local,backend1.local,8001,10,50
srv-host=_http._tcp.services.local,backend2.local,8002,10,50
srv-host=_http._tcp.services.local,backend3.local,8003,10,50
srv-host=_http._tcp.services.local,backend4.local,8004,10,50

# A records for backend hostnames
address=/backend1.local/127.0.0.1
address=/backend2.local/127.0.0.1
address=/backend3.local/127.0.0.1
address=/backend4.local/127.0.0.1
